name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install lupa luaparser
      - name: Variables globales (typos, local oublié)
        run: python tests/check_globals.py
      - name: Simulation du marché et de l'interface
        run: python tests/run_test.py
      - name: Module Vente (prix, file, undercuts, mise en vente)
        run: python tests/test_sell.py
      - name: Surveillance (parseur de prix, alertes, anti-spam, réarmement)
        run: python tests/test_watch.py
  luacheck:
    # informatif tant que les règles n'ont pas été ajustées sur un premier passage
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Installer luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck
      - name: luacheck
        run: luacheck .
